services:
  - type: web
    plan: free
    name: book-manager
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'python manage.py runserver 0.0.0.0:$PORT'
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: book_manager.settings_production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: book-manager-scf6.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://book-manager-scf6.onrender.com
      - key: WEB_CONCURRENCY
        value: 4
